/* ============================================================
   ROUTES — polylines (turstier + båtruter)
   ============================================================ */

/* ============================================================
   Map initialisation
   ============================================================ */
const ATTR = '© <a href="https://www.kartverket.no" target="_blank">Kartverket</a>';
const KV_BASE = 'https://cache.kartverket.no/v1/wmts/1.0.0';

const layers = {
  topo:    L.tileLayer(`${KV_BASE}/topo/default/webmercator/{z}/{y}/{x}.png`,          { attribution: ATTR, maxZoom: 19, crossOrigin: true }),
  sjokart: L.tileLayer(`${KV_BASE}/sjokartraster/default/webmercator/{z}/{y}/{x}.png`, { attribution: ATTR, maxZoom: 18, crossOrigin: true }),
  turkart: L.tileLayer(`${KV_BASE}/toporaster/default/webmercator/{z}/{y}/{x}.png`,    { attribution: ATTR, maxZoom: 19, crossOrigin: true })
};

const map = L.map('map', {
  center: [58.063, 7.849],   // Oversikt: Høllen – Ny-Hellesund – Langenes
  zoom: 14,
  minZoom: 10, maxZoom: 19,
  zoomControl: false,
  attributionControl: true,
  layers: [layers.topo]
});

L.control.zoom({ position: 'bottomright' }).addTo(map);
L.control.scale({ position: 'bottomleft', imperial: false, maxWidth: 160 }).addTo(map);

/* ============================================================
   Marker rendering
   ============================================================ */
const markersByCat = {};
Object.keys(CATEGORIES).forEach(c => markersByCat[c] = []);

function makeIcon(cat) {
  const c = CATEGORIES[cat];
  const cls = cat === 'cabin' ? 'marker-pin cabin' : 'marker-pin';
  const html = `<div class="${cls}" style="background:${c.color}"><span class="ico">${c.ico}</span></div>`;
  const size = cat === 'cabin' ? [44,44] : [32,32];
  const anch = cat === 'cabin' ? [22,42] : [16,30];
  return L.divIcon({ html, className: 'mk', iconSize: size, iconAnchor: anch, popupAnchor: [0,-30] });
}

POIS.forEach(p => {
  const m = L.marker([p.lat, p.lng], { icon: makeIcon(p.cat), zIndexOffset: p.cat === 'cabin' ? 1000 : 0 });
  m.poi = p;
  m.on('click', () => openPanel(p));
  m.addTo(map);
  markersByCat[p.cat].push(m);
});

/* ============================================================
   Polyline (ROUTES) rendering — trails + boat routes
   ============================================================ */
const routesByCat = {};
const routesByCatCount = {};
Object.keys(CATEGORIES).forEach(c => { routesByCat[c] = []; routesByCatCount[c] = 0; });

ROUTES.forEach(r => {
  const cat = CATEGORIES[r.cat];
  const w = (r.style && r.style.weight) || 4;
  const dash = (r.style && r.style.dashArray) || null;

  // Casing: white outline for legibility on busy basemaps
  const casing = L.polyline(r.coords, {
    color: '#ffffff', weight: w + 3, opacity: 0.9,
    lineCap: 'round', lineJoin: 'round', interactive: false
  }).addTo(map);

  // Visible coloured line — kept non-interactive so the wider hit-area below catches clicks
  const line = L.polyline(r.coords, {
    color: cat.color, weight: w, opacity: 0.95,
    dashArray: dash, lineCap: 'round', lineJoin: 'round',
    interactive: false
  }).addTo(map);

  // Hit area: a wide, nearly-invisible polyline that captures clicks even for thin dashed strokes
  const hit = L.polyline(r.coords, {
    color: cat.color, weight: Math.max(w + 10, 14), opacity: 0.001,
    lineCap: 'round', lineJoin: 'round'
  });
  hit.poi = r;
  hit.on('click', () => openPanel(r));
  hit.on('mouseover', () => line.setStyle({ weight: w + 1.5 }));
  hit.on('mouseout',  () => line.setStyle({ weight: w        }));
  hit.addTo(map);

  // Endpoint dots
  const startDot = L.circleMarker(r.coords[0], {
    radius: 5, fillColor: cat.color, color: 'white', weight: 2, fillOpacity: 1, interactive: false
  }).addTo(map);
  const endDot = L.circleMarker(r.coords[r.coords.length - 1], {
    radius: 5, fillColor: cat.color, color: 'white', weight: 2, fillOpacity: 1, interactive: false
  }).addTo(map);

  routesByCat[r.cat].push(line, casing, hit, startDot, endDot);
  routesByCatCount[r.cat] += 1;
});

/* ============================================================
   Side panel
   ============================================================ */
const panel = document.getElementById('sidepanel');
const spHero = document.getElementById('sp-hero');
const spBadge = document.getElementById('sp-badge');
const spTitle = document.getElementById('sp-title');
const spSub   = document.getElementById('sp-subtitle');
const spBody  = document.getElementById('sp-body');
const spMeta  = document.getElementById('sp-meta');
const spSources = document.getElementById('sp-sources');

let currentPOI = null;
let currentLang = 'no';

function openPanel(p) {
  currentPOI = p;
  renderPanel();
  panel.classList.add('open');
  if (window.innerWidth > 720 && p.lat) {
    const px = map.latLngToContainerPoint([p.lat, p.lng]);
    const offset = Math.max(0, px.x - (window.innerWidth - 420 - 60));
    if (offset > 0) map.panBy([offset, 0], { animate: true });
  }
}
document.getElementById('sidepanel-close').onclick = () => { panel.classList.remove('open'); currentPOI = null; };
map.on('click', () => { panel.classList.remove('open'); currentPOI = null; });

function renderPanel() {
  if (!currentPOI) return;
  const p = currentPOI;
  const lang = currentLang;
  const cat = CATEGORIES[p.cat];

  spHero.style.background = `linear-gradient(135deg, ${cat.color} 0%, ${shade(cat.color, 0.55)} 100%)`;
  spHero.style.backgroundSize = 'cover';
  spBadge.innerHTML = `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cat.color}"></span> ${cat.label[lang]}`;

  spTitle.textContent    = p.name[lang];
  spSub.textContent      = p.sub ? p.sub[lang] : '';
  spBody.innerHTML       = `<p>${p.body[lang]}</p>`;

  const t = I18N[lang];
  let metaHtml = '';
  metaHtml += `<div class="sidepanel-meta-row"><div class="label">${t.cat_label}</div><div>${cat.ico}&nbsp;${cat.label[lang]}</div></div>`;
  if (p.lat !== undefined) {
    metaHtml += `<div class="sidepanel-meta-row"><div class="label">${t.coord_label}</div><div>${p.lat.toFixed(5)}°N, ${p.lng.toFixed(5)}°E${p.note_coords ? ' <span style="color:#b85050">(' + p.note_coords + ')</span>' : ''}</div></div>`;
  } else if (p.coords) {
    const from = p.coords[0], to = p.coords[p.coords.length - 1];
    metaHtml += `<div class="sidepanel-meta-row"><div class="label">${lang==='no'?'Punkter':'Points'}</div><div>${p.coords.length} ${lang==='no'?'punkter':'points'}</div></div>`;
    metaHtml += `<div class="sidepanel-meta-row"><div class="label">${lang==='no'?'Fra':'From'}</div><div>${from[0].toFixed(5)}°N, ${from[1].toFixed(5)}°E</div></div>`;
    metaHtml += `<div class="sidepanel-meta-row"><div class="label">${lang==='no'?'Til':'To'}</div><div>${to[0].toFixed(5)}°N, ${to[1].toFixed(5)}°E</div></div>`;
  }
  spMeta.innerHTML = metaHtml;

  if (p.sources && p.sources.length) {
    spSources.innerHTML = `<strong>${t.sources_label}</strong>` + p.sources.map(s => `<a href="${s.url}" target="_blank" rel="noopener">↗ ${s.label}</a>`).join('');
  } else {
    spSources.innerHTML = '';
  }
}

function shade(hex, factor) {
  const n = parseInt(hex.replace('#',''), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.round(r * factor); g = Math.round(g * factor); b = Math.round(b * factor);
  return `rgb(${r},${g},${b})`;
}

/* ============================================================
   Filter bar
   ============================================================ */
const filterBar = document.getElementById('filter-bar');
const activeCats = new Set(Object.keys(CATEGORIES));
let userHasFiltered = false;  // false = default "show all" state

function renderFilterBar() {
  filterBar.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    const markerCount = markersByCat[key] ? markersByCat[key].length : 0;
    const routeCount  = routesByCatCount[key] || 0;
    const count = markerCount + routeCount;
    if (!count && key !== 'cabin') return;
    const chip = document.createElement('div');
    chip.className = 'chip' + (activeCats.has(key) ? '' : ' muted');
    chip.dataset.cat = key;
    chip.innerHTML = `
      <div class="chip-icon" style="background:${cat.color}">${cat.ico}</div>
      <span class="label">${cat.label[currentLang]}</span>
      <span class="chip-count">${count}</span>`;
    chip.onclick = () => toggleCat(key);
    filterBar.appendChild(chip);
  });
}

function applyVisibility() {
  Object.keys(CATEGORIES).forEach(key => {
    const items = [...(markersByCat[key] || []), ...(routesByCat[key] || [])];
    const show = activeCats.has(key);
    items.forEach(m => { if (show) m.addTo(map); else map.removeLayer(m); });
  });
}

function toggleCat(key) {
  if (!userHasFiltered) {
    // First click from the default "all shown" state: isolate this category
    activeCats.clear();
    activeCats.add(key);
    userHasFiltered = true;
  } else {
    // Subsequent clicks: add or remove individual categories
    if (activeCats.has(key)) activeCats.delete(key); else activeCats.add(key);
    // If nothing is left selected, reset back to the default "all shown" state
    if (activeCats.size === 0) {
      Object.keys(CATEGORIES).forEach(k => activeCats.add(k));
      userHasFiltered = false;
    }
  }
  applyVisibility();
  renderFilterBar();
}

/* ============================================================
   Layer + language switches
   ============================================================ */
document.getElementById('layer-switch').addEventListener('click', e => {
  const btn = e.target.closest('button[data-layer]');
  if (!btn) return;
  const k = btn.dataset.layer;
  document.querySelectorAll('#layer-switch button').forEach(b => b.classList.toggle('active', b === btn));
  Object.entries(layers).forEach(([name, lyr]) => {
    if (name === k) lyr.addTo(map); else map.removeLayer(lyr);
  });
});

document.getElementById('lang-switch').addEventListener('click', e => {
  const btn = e.target.closest('button[data-lang]');
  if (!btn) return;
  currentLang = btn.dataset.lang;
  document.querySelectorAll('#lang-switch button').forEach(b => b.classList.toggle('active', b === btn));
  document.documentElement.lang = currentLang;
  applyI18N();
  renderFilterBar();
  if (currentPOI) renderPanel();
});

function applyI18N() {
  const t = I18N[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.dataset.i18n;
    if (t[k]) el.textContent = t[k];
  });
}

/* ============================================================
   Initial render
   ============================================================ */
renderFilterBar();
applyI18N();

/* No auto-open — cabin is already centered at default zoom */
</script>
